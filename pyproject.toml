[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gamescripts"
version = "0.1.0"
description = "AI-powered solvers for word games (Contexto, Wordle, and more)"
requires-python = ">=3.10"
dependencies = [
    "anthropic",
    "requests",
    "rich",
    "python-dotenv",
]

[project.scripts]
contexto-solver = "contexto.solver:main"
wordle-solver = "wordle.solver:main"

[tool.hatch.build.targets.wheel]
packages = ["contexto", "wordle"]
